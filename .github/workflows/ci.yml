name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # The primary job validates the pinned Pi 1.0.0 baseline. The floor job checks
  # the earliest supported Pi: 0.87.1 introduced agent_before_settle, which keeps
  # completion notifications retractable until the final actionable boundary.
  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install floor Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@0.87.1 @earendil-works/pi-ai@0.87.1 @earendil-works/pi-tui@0.87.1
      - name: Typecheck against floor Pi
        run: npm run typecheck
      - name: Test suite against floor Pi
        run: npx vitest run --reporter=dot

  # Forward canary: reinstall whatever Pi is `latest` over the pin, so a release newer than
  # the baseline surfaces here before it reaches users. It runs the full typecheck + suite,
  # not a hand-picked file list, so new drift can't hide in a test nobody remembered to add
  # here. The pinned baseline is Pi 1.0.0.
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true # current Pi is not a hard support guarantee; surface breakage without blocking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
