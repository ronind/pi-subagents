name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm run build

  # The oldest supported host still runs the full typecheck and test suite.
  # Development and the build job use Pi 1.2.0; the peer floor remains 1.1.0.
  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install floor Pi
        run: pnpm add --save-dev --ignore-scripts @earendil-works/pi-coding-agent@1.1.0 @earendil-works/pi-ai@1.1.0 @earendil-works/pi-tui@1.1.0
      - name: Typecheck against floor Pi
        run: pnpm run typecheck
      - name: Test suite against floor Pi
        run: pnpm exec vitest run --reporter=dot

  # Forward canary: a newer host surfaces drift without changing the baseline.
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install current Pi
        run: pnpm add --save-dev --ignore-scripts @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: pnpm run typecheck
      - name: Test suite against current Pi
        run: pnpm exec vitest run --reporter=dot
